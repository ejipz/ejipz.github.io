<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- maximum-scale=1.0, user-scalable=no disables pinch zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Archive</title>
  
  <!-- google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/logos/favicon.png">
</head>

<body>
<!-- shown during the loading state -->
<div id="loading"><div class="spinner"></div><div>Loading...</div></div>

<!-- empty div that three.js injects its canvas into at runtime -->
<div id="canvas-wrap"></div>

<!-- 2D UI -->
<div id="hud">
  <!-- mute button -->
  <button id="muteBtn" class="icon-btn" aria-label="Mute sound" title="Mute sound">
    <svg id="muteIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    <svg id="muteIconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>

  <!-- teleport buttons -->
  <div id="dock">
    <button class="dock-btn" data-shelf="about"><span class="dock-dot" style="background:var(--accent-about)"></span>About Me</button>
    <button class="dock-btn" data-shelf="experience"><span class="dock-dot" style="background:var(--accent-exp)"></span>Experience</button>
    <button class="dock-btn" data-shelf="certificates"><span class="dock-dot" style="background:var(--accent-certs)"></span>Achievements</button>
    <button class="dock-btn" data-shelf="projects"><span class="dock-dot" style="background:var(--accent-projects)"></span>Projects</button>
  </div>

  <!-- book hover text -->
  <div id="crosshair-hint"><div class="pill" id="hintText">Click to open</div></div>

  <!-- appears at the bottom at the start -->
  <div id="instructions">
    <!-- for laptop devices -->
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
    <span>drag mouse — look around</span>
    <span>click a book — open it</span>
  </div>

  <!-- for mobile devices -->
  <div id="touch-move-hint">drag left side — move</div>
  <div id="touch-look-hint">drag right side — look</div>
</div>

<!-- book modal template -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="card" id="modalCard" style="--current-accent: var(--brass);">
    <div class="card-stub">
      <div>
        <span class="stamp" id="modalStamp">ISSUED</span>
        <div class="call-code" id="modalCallCode">PRJ.01</div>
      </div>
      <div class="checkout" id="modalCheckout"></div>
    </div>
    <div class="card-body">
      <button class="card-close" id="modalClose" aria-label="Close">✕</button>
      <p class="eyebrow" id="modalEyebrow">Project</p>
      <h3 id="modalTitle">Title</h3>
      <p class="meta" id="modalMeta"></p>
      <div class="book-image" id="modalImage"></div>
      <p class="desc" id="modalDesc"></p>
      <div class="school-list" id="modalSchools"></div>
      <ul class="bullets" id="modalBullets" style="display:none;"></ul>
      <div class="tag-row" id="modalTags"></div>
      <div class="link-row" id="modalLinks"></div>
      <div class="related-row" id="modalRelated" style="display:none;"></div>
    </div>
  </div>
</div>

<!-- catalogue -->
<div class="catalog-backdrop" id="catalogBackdrop">
  <div class="catalog-panel">
    <div class="catalog-header">
      <div>
        <h3>Catalogue</h3>
      </div>
      <button class="card-close" id="catalogClose">✕</button>
    </div>
    <input type="text" id="catalogSearch" class="catalog-search" placeholder="Search" autocomplete="off">
    <div class="catalog-list" id="catalogList"></div>
    <p class="catalog-empty" id="catalogEmpty" style="display:none;">No matches</p>
  </div>
</div>

<!-- database-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- javascript -->
<script src="js/data.js"></script>
<script src="js/textures.js"></script>
<script src="js/scene-builders.js"></script>
<script src="js/player.js"></script>
<script src="js/audio.js"></script>
<script src="js/controls.js"></script>
<script src="js/loop.js"></script>
<script src="js/modal.js"></script>
<script src="js/catalogue.js"></script>
<script src="js/app.js"></script>
</body>
</html>
